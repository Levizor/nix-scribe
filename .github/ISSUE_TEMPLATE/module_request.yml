name: Module Proposal
description: Propose a new module to scan system state and map it to NixOS options.
title: "[Module]: "
labels: ["module"]
body:
  - type: input
    id: component-name
    attributes:
      label: Target Component
      description: Service, program, or system subsystem to support (e.g. services.openssh, programs.zsh, security.pam).
      placeholder: e.g. services.openssh
    validations:
      required: true
  - type: textarea
    id: source-files
    attributes:
      label: Source Configuration & Files
      description: Target files or directories to inspect via filesystem scanning (e.g. /etc/ssh/sshd_config, binary detection paths).
      placeholder: |
        - Paths to scan: /etc/...
        - Detection criteria:
    validations:
      required: true
  - type: textarea
    id: nixos-options
    attributes:
      label: Target NixOS Options
      description: NixOS options that should be configured and how source values map to them.
      placeholder: |
        - services.openssh.enable = true;
        - services.openssh.settings.PasswordAuthentication = ...;
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Edge cases, auxiliary assets to extract, or multi-distro differences if known.
    validations:
      required: false
