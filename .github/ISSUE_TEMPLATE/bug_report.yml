name: Bug Report
description: Report an issue, crash, or incorrect NixOS configuration generation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened. If nix-scribe crashed, include the error or traceback. If invalid Nix was generated, include the output snippet.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Environment & Reproduction
      description: Distribution scanned, nix-scribe command/flags, and relevant source configuration files if applicable.
      placeholder: |
        - Target OS / Distro:
        - Command: nix-scribe -m 2
        - Relevant source files (e.g. /etc/fstab, /etc/ssh/...):
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should nix-scribe have generated or done instead?
    validations:
      required: false
