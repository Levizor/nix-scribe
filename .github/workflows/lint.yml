name: Lint & Format Checks (Ruff)
on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main, "refactor/**"]

jobs:
  lint:
    name: Ruff Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ruff Check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

      - name: Ruff Format Check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."
